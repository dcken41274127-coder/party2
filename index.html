<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>榮工春酒桌次查詢系統</title>
    <style>
        :root { --primary-color: #d32f2f; --bg-color: #fcf4f4; }
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: var(--bg-color); display: flex; justify-content: center; padding: 20px; margin: 0; }
        .container { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; position: relative; }
        
        /* 右上角切換按鈕 */
        .admin-btn { position: absolute; top: 15px; right: 15px; font-size: 0.75em; padding: 5px 10px; background: #eee; border-radius: 5px; cursor: pointer; color: #666; border: 1px solid #ddd; }
        .admin-btn.active { background: #d32f2f; color: white; border-color: #b71c1c; }

        h2 { color: var(--primary-color); margin-top: 10px; letter-spacing: 2px; }
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 12px; border: 2px solid #eee; border-radius: 10px; font-size: 16px; }
        button { padding: 12px 20px; background-color: var(--primary-color); color: white; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; font-weight: bold; }
        
        .mode-tip { font-size: 0.85em; margin-bottom: 10px; padding: 5px; border-radius: 5px; }
        .guest-mode { background: #e3f2fd; color: #1976d2; }
        .staff-mode { background: #fff3e0; color: #e65100; }

        #result { margin-top: 15px; }
        .guest-card { background: #fff; border: 1px solid #eee; border-left: 6px solid var(--primary-color); padding: 20px; border-radius: 12px; text-align: left; margin-bottom: 15px; position: relative; }
        .table-num { font-size: 2.5em; color: var(--primary-color); font-weight: 900; position: absolute; right: 20px; top: 15px; }
        .info-row { margin-bottom: 8px; width: 70%; }
        .label { color: #888; font-size: 0.85em; display: block; }
        .value { font-size: 1.1em; font-weight: bold; color: #333; }
        .status-msg { color: #666; font-size: 0.8em; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div id="adminBtn" class="admin-btn" onclick="toggleStaffMode()">工作人員</div>
    <h2>🧧 榮工春酒查詢</h2>
    
    <div id="modeTip" class="mode-tip guest-mode">目前模式：一般嘉賓查詢</div>
    
    <div id="loadingStatus" class="status-msg">正在同步最新名單...</div>
    
    <div class="search-box">
        <input type="text" id="nameInput" placeholder="請輸入姓名或廠商" onkeypress="if(event.key==='Enter') searchTable()">
        <button onclick="searchTable()">查詢</button>
    </div>
    
    <div id="result"></div>
</div>

<script>
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQkD6buIF5IF1OevFbSbRABxFg464c2tlTt3tC5BM5JYPCPbOrZhB1_7LYt-_kiMnlSmWLdo4p6CBBW/pub?output=csv';
    const STAFF_PASSWORD = '27945229';

    let guestData = [];
    let isStaffMode = false;

    // 切換模式功能
    function toggleStaffMode() {
        if (!isStaffMode) {
            const pwd = prompt("請輸入工作人員密碼：");
            if (pwd === STAFF_PASSWORD) {
                isStaffMode = true;
                document.getElementById('adminBtn').innerText = "退出後台";
                document.getElementById('adminBtn').classList.add('active');
                document.getElementById('modeTip').innerText = "目前模式：工作人員 (支援桌號查詢)";
                document.getElementById('modeTip').className = "mode-tip staff-mode";
                document.getElementById('nameInput').placeholder = "輸入姓名、廠商或桌號";
                alert("已開啟工作人員權限：現在輸入數字可查詢該桌名單。");
            } else if (pwd !== null) {
                alert("密碼錯誤！");
            }
        } else {
            isStaffMode = false;
            document.getElementById('adminBtn').innerText = "工作人員";
            document.getElementById('adminBtn').classList.remove('active');
            document.getElementById('modeTip').innerText = "目前模式：一般嘉賓查詢";
            document.getElementById('modeTip').className = "mode-tip guest-mode";
            document.getElementById('nameInput').placeholder = "請輸入姓名或廠商";
            document.getElementById('result').innerHTML = "";
        }
    }

    async function fetchSheetData() {
        try {
            const response = await fetch(SHEET_CSV_URL, { cache: "no-store" });
            const buffer = await response.arrayBuffer();
            const decoder = new TextDecoder('utf-8');
            const csvText = decoder.decode(buffer);
            
            const rows = csvText.split(/\r?\n/).filter(row => row.trim() !== "");
            if (rows.length < 2) return;

            const headers = rows[0].split(',').map(h => h.trim());
            const idx = {
                table: headers.indexOf("桌次"),
                company: headers.indexOf("廠商名稱"),
                name: headers.indexOf("姓名"),
                title: headers.indexOf("職稱"),
                count: headers.indexOf("參加人數")
            };

            const dataRows = rows.slice(1);
            guestData = dataRows.map(row => {
                const cols = row.split(',').map(c => c.replace(/^"|"$/g, '').trim());
                return {
                    table:   idx.table !== -1 ? cols[idx.table] : "",
                    company: idx.company !== -1 ? cols[idx.company] : "",
                    name:    idx.name !== -1 ? cols[idx.name] : "",
                    title:   idx.title !== -1 ? cols[idx.title] : "",
                    count:   idx.count !== -1 ? cols[idx.count] : "0"
                };
            }).filter(g => g.name || g.company);

            document.getElementById('loadingStatus').innerText = "✅ 名單同步完成";
        } catch (error) {
            document.getElementById('loadingStatus').innerText = "❌ 同步失敗";
        }
    }

    function searchTable() {
        const keyword = document.getElementById('nameInput').value.trim();
        const resultDiv = document.getElementById('result');
        resultDiv.innerHTML = ""; 

        if (!keyword) return;

        let matches = [];

        // 判斷是否為數字搜尋
        const isNumeric = /^\d+$/.test(keyword);

        if (isNumeric) {
            if (isStaffMode) {
                // 工作人員模式：允許搜數字
                matches = guestData.filter(g => g.table === keyword);
            } else {
                // 嘉賓模式：搜數字則不顯示結果
                resultDiv.innerHTML = "<div style='color:#666;'>一般嘉賓模式僅限姓名查詢，若需協助請洽工作人員。</div>";
                return;
            }
        } else {
            // 文字搜尋：姓名或廠商
            matches = guestData.filter(g => 
                (g.name && g.name.includes(keyword)) || 
                (g.company && g.company.includes(keyword))
            );
        }

        if (matches.length > 0) {
            matches.forEach(person => {
                resultDiv.innerHTML += `
                    <div class="guest-card">
                        <span class="table-num">${person.table}</span>
                        <div class="info-row">
                            <span class="label">姓名 / 職稱</span>
                            <span class="value">${person.name || "團體"} <small style="font-weight:normal; color:#666;">(${person.title || "無"})</small></span>
                        </div>
                        <div class="info-row">
                            <span class="label">所屬單位</span>
                            <span class="value">${person.company || "個人"}</span>
                        </div>
                        <div class="info-row">
                            <span class="label">出席人數</span>
                            <span class="value">${person.count} 位</span>
                        </div>
                    </div>
                `;
            });
        } else {
            resultDiv.innerHTML = "<div style='color:red; margin-top:20px;'>查無資料，請確認輸入是否正確。</div>";
        }
    }

    fetchSheetData();
</script>

</body>
</html>
