<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>榮工春酒桌次查詢系統 (雲端同步安全版)</title>
    <style>
        :root { --primary-color: #d32f2f; --bg-color: #fcf4f4; }
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: var(--bg-color); display: flex; justify-content: center; padding: 20px; margin: 0; }
        .container { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; position: relative; }
        h2 { color: var(--primary-color); margin-top: 15px; letter-spacing: 2px; }
        
        /* 右上角管理按鈕 */
        .admin-btn { position: absolute; top: 15px; right: 15px; background: #f0f0f0; color: #888; text-decoration: none; font-size: 11px; padding: 4px 8px; border-radius: 15px; border: 1px solid #ddd; transition: 0.3s; }
        .admin-btn:hover { background: #e0e0e0; color: #333; }

        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 12px; border: 2px solid #eee; border-radius: 10px; font-size: 16px; -webkit-appearance: none; }
        button { padding: 12px 20px; background-color: var(--primary-color); color: white; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; font-weight: bold; }
        
        #result { margin-top: 15px; }
        .guest-card { background: #fff; border: 1px solid #eee; border-left: 6px solid var(--primary-color); padding: 20px; border-radius: 12px; text-align: left; margin-bottom: 15px; position: relative; animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .table-num { font-size: 2.5em; color: var(--primary-color); font-weight: 900; position: absolute; right: 20px; top: 15px; }
        .info-row { margin-bottom: 8px; width: 70%; }
        .label { color: #888; font-size: 0.85em; display: block; }
        .value { font-size: 1.1em; font-weight: bold; color: #333; }
        .status-msg { color: #666; font-size: 0.8em; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <a href="javascript:void(0)" onclick="checkAdminPassword()" class="admin-btn">⚙️ 管理名單</a>

    <h2>🧧 榮工春酒桌次查詢</h2>
    <div id="loadingStatus" class="status-msg">正在同步雲端名單...</div>
    
    <div class="search-box">
        <input type="text" id="nameInput" placeholder="輸入姓名、廠商或桌號" onkeypress="if(event.key==='Enter') searchTable()">
        <button onclick="searchTable()">查詢</button>
    </div>
    
    <div id="result"></div>
</div>

<script>
    // 🔗 1. 請填入發佈為 CSV 的網址
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQkD6buIF5IF1OevFbSbRABxFg464c2tlTt3tC5BM5JYPCPbOrZhB1_7LYt-_kiMnlSmWLdo4p6CBBW/pub?output=csv';
    
    // 🔗 2. 請填入 Google Sheets 的編輯網址 (密碼後跳轉用)
    const EDIT_SHEET_URL = 'https://docs.google.com/spreadsheets/d/14_bUyEP5xN56NrSADemrRSNK8O8kNLA04CmcUXx39q4/edit?usp=sharing';

    let guestData = [];

    // 同步資料
    async function fetchSheetData() {
        try {
            const response = await fetch(SHEET_CSV_URL, { cache: "no-store" });
            if (!response.ok) throw new Error('網路連線異常');

            const buffer = await response.arrayBuffer();
            const decoder = new TextDecoder('utf-8');
            const csvText = decoder.decode(buffer);
            
            const rows = csvText.split(/\r?\n/).filter(row => row.trim() !== "");
            if (rows.length < 2) return;

            // 自動辨識標題欄位位置
            const headers = rows[0].split(',').map(h => h.trim());
            const idx = {
                table: headers.indexOf("桌次"),
                company: headers.indexOf("廠商名稱"),
                name: headers.indexOf("姓名"),
                title: headers.indexOf("職稱"),
                count: headers.indexOf("參加人數")
            };

            const dataRows = rows.slice(1);
            guestData = dataRows.map(row => {
                const cols = row.split(',').map(c => c.replace(/^"|"$/g, '').trim());
                return {
                    table:   idx.table !== -1 ? cols[idx.table] : "",
                    company: idx.company !== -1 ? cols[idx.company] : "",
                    name:    idx.name !== -1 ? cols[idx.name] : "",
                    title:   idx.title !== -1 ? cols[idx.title] : "",
                    count:   idx.count !== -1 ? cols[idx.count] : "0"
                };
            }).filter(g => g.name || g.company);

            document.getElementById('loadingStatus').innerText = "✅ 雲端名單已同步完成";
        } catch (error) {
            document.getElementById('loadingStatus').innerText = "❌ 同步失敗：" + error.message;
        }
    }

    // 搜尋功能
    function searchTable() {
        const keyword = document.getElementById('nameInput').value.trim();
        const resultDiv = document.getElementById('result');
        resultDiv.innerHTML = ""; 

        if (!keyword) return;

        let matches = [];

        // 智慧判斷：純數字查桌號，文字查姓名/廠商
        if (/^\d+$/.test(keyword)) {
            matches = guestData.filter(g => g.table === keyword);
        } else {
            matches = guestData.filter(g => 
                (g.name && g.name.includes(keyword)) || 
                (g.company && g.company.includes(keyword))
            );
        }

        if (matches.length > 0) {
            matches.forEach(person => {
                resultDiv.innerHTML += `
                    <div class="guest-card">
                        <span class="table-num">${person.table}</span>
                        <div class="info-row">
                            <span class="label">姓名 / 職稱</span>
                            <span class="value">${person.name || "團體"} <small style="font-weight:normal; color:#666;">(${person.title || "無"})</small></span>
                        </div>
                        <div class="info-row">
                            <span class="label">所屬單位</span>
                            <span class="value">${person.company || "個人/其它"}</span>
                        </div>
                        <div class="info-row">
                            <span class="label">出席人數</span>
                            <span class="value">${person.count} 位</span>
                        </div>
                    </div>
                `;
            });
        } else {
            resultDiv.innerHTML = "<div style='color:red; margin-top:20px;'>查無資料，請確認關鍵字是否正確。</div>";
        }
    }

    // 密碼檢查
    function checkAdminPassword() {
        const pwd = prompt("請輸入管理員密碼：");
        if (pwd === "27945229") {
            window.open(EDIT_SHEET_URL, '_blank');
        } else if (pwd !== null) {
            alert("密碼錯誤！");
        }
    }

    fetchSheetData();
</script>

</body>

</html>
