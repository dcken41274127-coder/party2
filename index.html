<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>榮工春酒桌次查詢系統</title>
    <style>
        :root { --primary-color: #d32f2f; --bg-color: #fcf4f4; }
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: var(--bg-color); display: flex; justify-content: center; padding: 20px; margin: 0; }
        .container { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; position: relative; }
        h2 { color: var(--primary-color); margin-top: 25px; letter-spacing: 2px; }
        
        /* 頂部按鈕通用樣式 */
        .top-btn { position: absolute; top: 15px; background: #f0f0f0; color: #888; text-decoration: none; font-size: 11px; padding: 4px 8px; border-radius: 15px; border: 1px solid #ddd; transition: 0.3s; cursor: pointer; }
        .top-btn:hover { background: #e0e0e0; color: #333; }
        
        /* 定位 */
        .btn-left { left: 15px; display: none; } /* 💡 初始設定為隱藏 */
        .btn-right { right: 15px; }

        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 12px; border: 2px solid #eee; border-radius: 10px; font-size: 16px; -webkit-appearance: none; }
        button { padding: 12px 20px; background-color: var(--primary-color); color: white; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; font-weight: bold; }
        
        #result { margin-top: 15px; }
        .guest-card { background: #fff; border: 1px solid #eee; border-left: 6px solid var(--primary-color); padding: 20px; border-radius: 12px; text-align: left; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: flex-start; animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .info-container { flex: 1; }
        .table-num { font-size: 2.2em; color: var(--primary-color); font-weight: 900; margin-left: 10px; text-align: right; line-height: 1.1; word-break: break-all; max-width: 45%; }
        .table-num.long { font-size: 1.3em; color: #d32f2f; }

        .info-row { margin-bottom: 8px; }
        .label { color: #888; font-size: 0.85em; display: block; }
        .value { font-size: 1.1em; font-weight: bold; color: #333; }
        .status-msg { color: #666; font-size: 0.8em; margin-bottom: 10px; }
        .staff-mode-badge { display: none; background: #fff3e0; color: #e65100; font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-bottom: 10px; border: 1px solid #ffe0b2; }
    </style>
</head>
<body>

<div class="container">
    <div id="adminBtn" onclick="adminLink()" class="top-btn btn-left">⚙️ 管理名單</div>
    <div id="staffBtn" onclick="staffUnlock()" class="top-btn btn-right">🧑‍💼 工作人員</div>

    <h2>🧧 榮工春酒桌次查詢</h2>
    <div id="staffBadge" class="staff-mode-badge">已解鎖：工作人員模式 (支援桌號查詢)</div>
    <div id="loadingStatus" class="status-msg">正在同步雲端名單...</div>
    
    <div class="search-box">
        <input type="text" id="nameInput" placeholder="請輸入姓名或廠商" onkeypress="if(event.key==='Enter') searchTable()">
        <button onclick="searchTable()">查詢</button>
    </div>
    
    <div id="result"></div>
</div>

<script>
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQkD6buIF5IF1OevFbSbRABxFg464c2tlTt3tC5BM5JYPCPbOrZhB1_7LYt-_kiMnlSmWLdo4p6CBBW/pub?output=csv';
    const GOOGLE_SHEET_EDIT_URL = 'https://docs.google.com/spreadsheets/d/14_bUyEP5xN56NrSADemrRSNK8O8kNLA04CmcUXx39q4/edit?usp=sharing';

    let guestData = [];
    let isStaffMode = false;

    async function fetchSheetData() {
        try {
            const response = await fetch(SHEET_CSV_URL, { cache: "no-store" });
            const buffer = await response.arrayBuffer();
            const decoder = new TextDecoder('utf-8');
            const csvText = decoder.decode(buffer);
            const rows = csvText.split(/\r?\n/).filter(row => row.trim() !== "");
            if (rows.length < 2) return;

            const headers = rows[0].split(',').map(h => h.trim());
            const idx = {
                table: headers.indexOf("桌次"),
                company: headers.indexOf("廠商名稱"),
                name: headers.indexOf("姓名"),
                title: headers.indexOf("職稱"),
                count: headers.indexOf("參加人數")
            };

            guestData = rows.slice(1).map(row => {
                const cols = row.split(',').map(c => c.replace(/^"|"$/g, '').trim());
                return {
                    table:   idx.table !== -1 ? cols[idx.table] : "",
                    company: idx.company !== -1 ? cols[idx.company] : "",
                    name:    idx.name !== -1 ? cols[idx.name] : "",
                    title:   idx.title !== -1 ? cols[idx.title] : "",
                    count:   idx.count !== -1 ? cols[idx.count] : "0"
                };
            }).filter(g => g.name || g.company);

            document.getElementById('loadingStatus').innerText = "✅ 名單已同步";
        } catch (e) {
            document.getElementById('loadingStatus').innerText = "❌ 同步失敗";
        }
    }

    function searchTable() {
        const keyword = document.getElementById('nameInput').value.trim();
        const resultDiv = document.getElementById('result');
        resultDiv.innerHTML = ""; 
        if (!keyword) return;

        let matches = [];
        if (/^\d+$/.test(keyword)) {
            if (isStaffMode) {
                matches = guestData.filter(g => g.table === keyword);
            } else {
                resultDiv.innerHTML = "<div style='color:orange; margin-top:20px;'>一般查詢不支援桌號搜尋，請輸入姓名或廠商。</div>";
                return;
            }
        } else {
            matches = guestData.filter(g => 
                (g.name && g.name.includes(keyword)) || 
                (g.company && g.company.includes(keyword))
            );
        }

        if (matches.length > 0) {
            matches.forEach(person => {
                const tableClass = person.table.length > 3 ? "table-num long" : "table-num";
                resultDiv.innerHTML += `
                    <div class="guest-card">
                        <div class="info-container">
                            <div class="info-row"><span class="label">姓名 / 職稱</span><span class="value">${person.name || "團體"} (${person.title || "無"})</span></div>
                            <div class="info-row"><span class="label">所屬單位</span><span class="value">${person.company || "個人"}</span></div>
                            <div class="info-row"><span class="label">人數</span><span class="value">${person.count} 位</span></div>
                        </div>
                        <div class="${tableClass}">${person.table}</div>
                    </div>
                `;
            });
        } else {
            resultDiv.innerHTML = "<div style='color:red; margin-top:20px;'>查無資料。</div>";
        }
    }

    // 左上角：管理名單 (驗證 279452299)
    function adminLink() {
        const pwd = prompt("請輸入管理名單密碼：");
        if (pwd === "279452299") {
            window.open(GOOGLE_SHEET_EDIT_URL, '_blank');
        } else if (pwd !== null) {
            alert("密碼錯誤");
        }
    }

    // 右上角：解鎖工作人員模式 (驗證 27945229)
    function staffUnlock() {
        const pwd = prompt("請輸入工作人員密碼：");
        if (pwd === "27945229") {
            isStaffMode = true;
            // 💡 解鎖功能：顯示左上角按鈕、顯示標籤、更換輸入提示
            document.getElementById('adminBtn').style.display = 'block';
            document.getElementById('staffBadge').style.display = 'inline-block';
            document.getElementById('nameInput').placeholder = "已解鎖：支援姓名、廠商、桌號查詢";
            alert("工作人員模式已解鎖，「管理名單」按鈕已出現在左上角。");
        } else if (pwd !== null) {
            alert("密碼錯誤");
        }
    }

    fetchSheetData();
</script>

</body>
</html>
